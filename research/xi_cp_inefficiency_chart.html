<div style="padding: 1rem 0">
<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:1rem;font-size:12px;color:var(--color-text-secondary)">
  <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#1D9E75"></span>molecular H-bond</span>
  <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#7F77DD"></span>coordination / chelate</span>
  <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#BA7517"></span>temporal (proline cycle)</span>
  <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:#888780"></span>Zr-oxo proxies (prior)</span>
</div>
<div style="position:relative;width:100%;height:340px">
<canvas id="xiChart"></canvas>
</div>
<p style="font-size:11px;color:var(--color-text-secondary);margin-top:8px;text-align:center">Lower ξ<sub>CP</sub> = more efficient constraint propagation. Values in nats (natural units of information waste).</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const labels = [
  'Triple H-bond\n(DAD·ADA)',
  'Zn–bpy chelate\n(Gℶ→Gℵ)',
  'Acetic acid\nhomodimer Fℏ',
  'Acid–amide\nheterodimer Fð',
  'Formamide\nhomodimer Fℓ',
  'Proline aldol\ncycle D∞',
  'Zr-oxo\n(balanced)',
  'Zr-oxo\n(tight singlet)',
  'Zr-oxo\n(+toluene)'
];
const data = [7.35, 8.25, 8.5, 9.5, 10.25, 10.65, 12.2, 15.0, 16.8];
const colors = [
  '#1D9E75','#7F77DD',
  '#1D9E75','#1D9E75','#1D9E75',
  '#BA7517',
  '#888780','#888780','#888780'
];

new Chart(document.getElementById('xiChart'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      data: data,
      backgroundColor: colors,
      borderRadius: 4,
      borderSkipped: false,
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: ctx => ' ξ_CP ≈ ' + ctx.parsed.x.toFixed(1) + ' nats'
        }
      }
    },
    scales: {
      x: {
        min: 6,
        max: 18,
        title: { display: true, text: 'ξ_CP (nats) — thermodynamic information waste', font: { size: 12 }, color: '#888780' },
        ticks: { font: { size: 11 }, color: '#888780' },
        grid: { color: 'rgba(136,135,128,0.15)' }
      },
      y: {
        ticks: { font: { size: 11 }, color: '#888780' },
        grid: { display: false }
      }
    }
  }
});
</script>
